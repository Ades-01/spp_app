<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A5F9E" />
    <title>离线模式 · 供应商预审平台</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #f4f8fc 0%, #e8f0f8 100%);
            color: #1f2d3d;
            padding: 24px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(26, 95, 158, 0.12);
            border: 1px solid rgba(26, 95, 158, 0.08);
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: #1A5F9E;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .logo svg {
                width: 40px;
                height: 40px;
            }

        h1 {
            font-size: 20px;
            color: #1A5F9E;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .status {
            display: inline-block;
            margin: 12px 0 16px;
            padding: 6px 16px;
            background: #fdf3e7;
            color: #b25e09;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

            .status.online {
                background: #e7f6ec;
                color: #1a7f37;
            }

        p {
            font-size: 14px;
            line-height: 1.8;
            color: #5a6b7d;
        }

        .tips {
            margin-top: 20px;
            text-align: left;
            font-size: 13px;
        }

            .tips li {
                margin: 6px 0;
                list-style: none;
                padding-left: 20px;
                position: relative;
            }

                .tips li::before {
                    content: "✓";
                    position: absolute;
                    left: 0;
                    color: #1A5F9E;
                    font-weight: 700;
                }

        button {
            margin-top: 28px;
            padding: 12px 32px;
            border: none;
            border-radius: 10px;
            background: #1A5F9E;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

            button:hover {
                background: #154d81;
            }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12.5l5 5L20 6.5" />
            </svg>
        </div>
        <h1>供应商预审平台</h1>
        <div class="status" id="netStatus">当前处于离线模式</div>
        <p>与本地服务器的连接已断开。<br />已缓存的审核问卷仍可正常填写，数据保存在本机数据库中。</p>
        <ul class="tips">
            <li>问卷草稿已自动保存，支持断点续填</li>
            <li>连接恢复后数据将自动同步</li>
            <li>局域网同步需重新启动本地服务</li>
        </ul>
        <button id="enterBtn" onclick="goApp()">进入应用</button>
    </div>
    <script>
        var viaHttp = location.protocol === 'http:' || location.protocol === 'https:';
        // 适配通用路径：file: 协议下使用同级 index.html，防止跨层级错误
        var APP_ENTRY = viaHttp ? './index.html' : './index.html';

        function goApp() {
            // 用户手动点击跳转时重置防循环标记，保证下次离线后自动跳转机制依然生效
            try {
                sessionStorage.removeItem('spp_offline_redirected');
            } catch (e) { }
            location.href = APP_ENTRY;
        }

        function refresh() {
            var el = document.getElementById('netStatus');
            var btn = document.getElementById('enterBtn');
            if (viaHttp) {
                if (navigator.onLine) {
                    el.textContent = '网络已恢复，正在进入应用…';
                    el.classList.add('online');
                    btn.textContent = '立即进入';
                    try {
                        if (!sessionStorage.getItem('spp_offline_redirected')) {
                            sessionStorage.setItem('spp_offline_redirected', '1');
                            setTimeout(goApp, 1500);
                        }
                    } catch (e) {
                        setTimeout(goApp, 1500);
                    }
                } else {
                    el.textContent = '当前处于离线模式';
                    el.classList.remove('online');
                    btn.textContent = '进入离线应用';
                }
            } else {
                el.textContent = '请通过「供应商预审平台」本地服务或应用图标进入';
                el.classList.remove('online');
                btn.textContent = '进入应用';
            }
        }

        window.addEventListener('online', refresh);
        window.addEventListener('offline', refresh);

        // 仅在 HTTP(S) 且网络在线时触发 SW 检查更新，避免离线报错
        if (viaHttp && navigator.onLine && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then(function (r) {
                if (r && r.update) r.update().catch(function () { });
            }).catch(function () { });
        }

        refresh();
    </script>
</body>
</html>
